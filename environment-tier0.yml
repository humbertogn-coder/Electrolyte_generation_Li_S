# Tier-0 environment for Grace (Linux): cheap descriptors with xtb (GFN2-xTB),
# CREST (conformers) and morfeus (ESP, volumes). CREST has no Windows build on
# conda-forge, which is why it is kept out of the main environment.
#
#   conda env create -f environment-tier0.yml
#   conda activate pace-s-tier0
#
# g-xTB (Grimme 2025) is installed separately if the week-0 test works;
# if it fights back, GFN2-xTB is plan B.
name: pace-s-tier0
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - rdkit
  - xtb
  - crest
  - ase
  - openbabel
  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - jsonschema>=4.18
  - snakemake-minimal   # orchestration; no Windows build, hence it lives here
  - pip:
      - morfeus-ml
      - -e .
