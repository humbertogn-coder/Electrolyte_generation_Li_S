# PACE-S campaign for elemental Li-S (primary system).
# Switching from Li-S to Li-SPAN means changing this file, not the code.
campaign_id: AL-01
system: Li-S
seed: 20260924

design_space:
  # Hard constraints (proposal sections 4 and 6). A candidate failing any of
  # them is discarded before tier 0.
  allowed_elements: [C, H, O, F, S, N, Si]
  # The proposal says 80-350, but DOL (74.1) and DMM (76.1) are seeds and would
  # fall outside. Minimum lowered to 70 so the space contains its own seeds.
  mol_weight_g_mol: { min: 70, max: 350 }
  melting_point_C: { max: -20 }       # estimated
  boiling_point_C: { min: 80 }        # estimated
  max_perfluoroalkyl_chain: 3         # PFAS criterion: no -(CF2)n- with n > 3
  forbidden_smarts:                   # forbidden reactive groups
    - "[N+](=O)[O-]"                  # nitro
    - "C(=O)Cl"                       # acyl chloride
    - "[SH]"                          # thiol
    - "N=[N+]=[N-]"                   # azide
    - "OO"                            # peroxide
    - "C#N"                           # nitrile: out until phase 2 (reactive toward Li metal)
    - "[Cl,Br,I]"                     # heavy halogens (also covered by allowed_elements)
  synthesizability:
    sascore_max: 4.5
    rascore_min: 0.7

generation:
  stage1_operators:
    - h_to_f
    - chain_extend
    - chain_contract
    - heteroatom_swap
    - ring_open
    - ring_close
    - bridge_insert
    - branch
  n_rounds: 3                                # breadth-first mutation rounds from the seeds
  # ~25 new children per parent and round (measured: 340/13 in round 1, 8233/305 in round 2).
  # If a round would exceed target_size.max, the frontier is randomly subsampled with `seed`.
  expected_children_per_parent: 25
  stage2: { method: safe, enabled: false }   # enabled on the best of stage 1
  target_size: { min: 20000, max: 60000 }

salts: [LiFSI, LiTFSI]                       # fixed; new salts are phase 2

# Pareto objectives (not summed). The weights enter the acquisition reference
# weighting and the final ranking; qNEHVI works on the front.
# direction: max = higher is better after the transformation in surrogate/objectives.py
objectives:
  O1_weak_solvation:
    metrics: [li_binding_eV, frac_CIP_AGG]
    target: moderate_binding_high_CIP_AGG
    weight: 1.0
  O2_polysulfide_retention:
    metrics: [solubility_Li2S8_mM]
    direction: min
    weight: 2.0          # dominant in Li-S
  O3_reductive_passivation:
    metrics: [reduction_onset_V, inorganic_fraction]
    direction: max
    weight: 0.6
  O4_transport:
    metrics: [sigma_mS_cm, viscosity_mPa_s]
    direction: max_sigma_min_viscosity
    weight: 0.6
  O5_synthesizability:
    metrics: [sascore, rascore]
    role: constraint     # a constraint, not a Pareto objective

calibration:
  gate:
    dataset: data/reference/joule2021_table1_solubility.csv
    metric: spearman
    threshold: 0.6       # H3 gate, week 3
  internal:
    tier0_vs_tier2_r2_min: 0.6

tiers:
  tier0:
    method: GFN2-xTB      # g-xTB if the installation works
    solvation: ALPB
    alpb_solvent: ether   # reference implicit solvent (diethyl ether)
    conformers: rdkit     # rdkit = ETKDG+MMFF, ~1 s. CREST --quick costs 1-6 min per molecule
                          # (measured: DME 95 s, TTE 330 s) and breaks the 5-min budget.
    n_rdkit_conformers: 10
    max_li_sites: 4       # O/N/S sites tried for Li+ and Li2S8
    max_cpu_min_per_molecule: 5
  tier1:
    mlip: TBD_after_H2    # MACE-OMol | UMA-OMol | uMLP-electrolytes
    n_atoms: [2000, 4000]
    length_ns: 2
    engine: lammps
    budget_formulations: 250
    conductivity_method: green_kubo   # Nernst-Einstein only as a bound; it overestimates
  tier2:
    functional: wB97X-D
    basis: def2-TZVPD
    solvation: CPCM
    budget_species: 300
  tier3:
    code: VASP
    surface: Li(100)
    length_ps: [20, 40]
    budget_systems: 4

active_learning:
  acquisition: qNEHVI
  batch_size: 60
  iterations: 3
  cold_start: data/reference/combat_seed.csv
  random_baseline: true   # the AL-vs-random comparison is mandatory (H4)
