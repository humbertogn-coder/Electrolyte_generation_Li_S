# Campaña PACE-S para Li-S elemental (sistema primario).
# Cambiar de Li-S a Li-SPAN es cambiar este archivo, no el código.
campaign_id: AL-01
system: Li-S
seed: 20260924

design_space:
  # Restricciones duras (sección 4 y 6 de la propuesta). Un candidato que falle
  # cualquiera se descarta antes de tier 0.
  allowed_elements: [C, H, O, F, S, N, Si]
  # La propuesta dice 80-350, pero DOL (74.1) y DMM (76.1) son semillas y quedarían
  # fuera. Mínimo bajado a 70 para que el espacio contenga a sus propias semillas.
  mol_weight_g_mol: { min: 70, max: 350 }
  melting_point_C: { max: -20 }       # estimado
  boiling_point_C: { min: 80 }        # estimado
  max_perfluoroalkyl_chain: 3         # criterio PFAS: sin -(CF2)n- con n > 3
  forbidden_smarts:                   # grupos reactivos prohibidos
    - "[N+](=O)[O-]"                  # nitro
    - "C(=O)Cl"                       # cloruro de acilo
    - "[SH]"                          # tiol
    - "N=[N+]=[N-]"                   # azida
    - "OO"                            # peróxido
    - "C#N"                           # nitrilo: fuera hasta fase 2 (reactivo con Li metal)
    - "[Cl,Br,I]"                     # halógenos pesados (cubierto también por allowed_elements)
  synthesizability:
    sascore_max: 4.5
    rascore_min: 0.7

generation:
  stage1_operators:
    - h_to_f
    - chain_extend
    - chain_contract
    - heteroatom_swap
    - ring_open
    - ring_close
    - bridge_insert
    - branch
  stage2: { method: safe, enabled: false }   # se activa sobre los mejores de la etapa 1
  target_size: { min: 20000, max: 60000 }

salts: [LiFSI, LiTFSI]                       # fijas; sales nuevas son fase 2

# Objetivos en Pareto (no sumados). Los pesos entran en la ponderación de la
# adquisición y en el ordenamiento final; qNEHVI trabaja sobre el frente.
# direction: max = mayor es mejor tras la transformación en surrogate/objectives.py
objectives:
  O1_weak_solvation:
    metrics: [li_binding_eV, frac_CIP_AGG]
    target: moderate_binding_high_CIP_AGG
    weight: 1.0
  O2_polysulfide_retention:
    metrics: [solubility_Li2S8_mM]
    direction: min
    weight: 2.0          # dominante en Li-S
  O3_reductive_passivation:
    metrics: [reduction_onset_V, inorganic_fraction]
    direction: max
    weight: 0.6
  O4_transport:
    metrics: [sigma_mS_cm, viscosity_mPa_s]
    direction: max_sigma_min_viscosity
    weight: 0.6
  O5_synthesizability:
    metrics: [sascore, rascore]
    role: constraint     # restricción, no objetivo de Pareto

calibration:
  gate:
    dataset: data/reference/joule2021_table1_solubility.csv
    metric: spearman
    threshold: 0.6       # compuerta H3, semana 3
  internal:
    tier0_vs_tier2_r2_min: 0.6

tiers:
  tier0:
    method: GFN2-xTB      # g-xTB si la instalación funciona
    solvation: ALPB
    conformers: CREST
    max_cpu_min_per_molecule: 5
  tier1:
    mlip: TBD_after_H2    # MACE-OMol | UMA-OMol | uMLP-electrolytes
    n_atoms: [2000, 4000]
    length_ns: 2
    engine: lammps
    budget_formulations: 250
    conductivity_method: green_kubo   # Nernst-Einstein solo como cota; sobreestima
  tier2:
    functional: wB97X-D
    basis: def2-TZVPD
    solvation: CPCM
    budget_species: 300
  tier3:
    code: VASP
    surface: Li(100)
    length_ps: [20, 40]
    budget_systems: 4

active_learning:
  acquisition: qNEHVI
  batch_size: 60
  iterations: 3
  cold_start: data/reference/combat_seed.csv
  random_baseline: true   # la comparación AL vs aleatorio es obligatoria (H4)
