[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-s"
version = "0.0.1"
description = "Pipeline for active generation and screening of electrolytes for lithium-metal batteries with sulfur chemistry (Li-S / Li-SPAN)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Carlos Guerrero", email = "humbertogn@tamu.edu" }]
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
chem = ["rdkit", "ase", "selfies", "morfeus-ml"]
ml = ["scikit-learn", "lightgbm", "torch", "botorch", "gpytorch", "shap"]
dev = ["pytest", "rdkit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pace_s" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: tests that recompute with xtb (minutes); run with -m slow"]
