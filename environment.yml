# Main PACE-S environment (Windows/Mac/Linux laptop): generation, filters,
# surrogate models, active learning, analysis and tests.
#
# Heavy compute codes live in separate environments because not all of them
# have Windows builds or they conflict with each other:
#   environment-tier0.yml  xtb, CREST, morfeus  (Grace, Linux)
#   environment-mlip.yml   MACE / fairchem, LAMMPS (Grace, GPU)
name: pace-s
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # chemistry
  - rdkit
  - ase
  # data and ML
  - numpy
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - lightgbm
  - pytorch
  - botorch
  - gpytorch
  - shap
  # trajectories (analysis only; MD runs in the MLIP environment)
  - mdanalysis
  # infrastructure
  - jsonschema>=4.18
  - pyyaml
  - pytest
  - jupyterlab
  - matplotlib
  - pip:
      - selfies
      - solvation-analysis
      - -e .
