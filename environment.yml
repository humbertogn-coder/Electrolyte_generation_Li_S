# Entorno principal de PACE-S (laptop Windows/Mac/Linux): generación, filtros,
# modelos sustitutos, active learning, análisis y tests.
#
# Los códigos de cómputo pesado viven en entornos aparte porque no todos tienen
# build para Windows o chocan entre sí:
#   environment-tier0.yml  xtb, CREST, morfeus  (Grace, Linux)
#   environment-mlip.yml   MACE / fairchem, LAMMPS (Grace, GPU)
name: pace-s
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # química
  - rdkit
  - ase
  # datos y ML
  - numpy
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - lightgbm
  - pytorch
  - botorch
  - gpytorch
  - shap
  # trayectorias (análisis; la MD corre en el entorno MLIP)
  - mdanalysis
  # infraestructura
  - jsonschema>=4.18
  - pyyaml
  - snakemake-minimal
  - pytest
  - jupyterlab
  - matplotlib
  - pip:
      - selfies
      - solvation-analysis
      - -e .
