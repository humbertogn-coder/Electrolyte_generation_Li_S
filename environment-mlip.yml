# Separate environment for MLIP molecular dynamics (tier 1) and the potential
# benchmark (H2). Pick ONE of the MLIP lines according to the H2 decision;
# installing all of them at once usually breaks the PyTorch/CUDA resolution.
# LAMMPS with the MACE or DeePMD plugin is compiled separately on Grace.
name: pace-s-mlip
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch
  - pytorch-cuda=12.1   # match the CUDA version of Grace's GPU queue
  - ase
  - numpy
  - mdanalysis
  - packmol
  - openmm
  - pip:
      - mace-torch          # MACE / MACE-OMol
      - fairchem-core       # UMA / OMol25
      # - deepmd-kit        # electrolyte uMLP (Nat. Commun. 2025), ai2-kit
      - solvation-analysis
